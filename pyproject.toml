[project]
name = "daedalus"
version = "0.1.0"
description = "A personal, self-developing Telegram agent built on the protocore agent core."
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
dependencies = [
    "protocore",
    "aiogram>=3.15",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "httpx>=0.27",
    "aiosqlite>=0.20",
    "pydantic>=2.7",
    "pydantic-settings>=2.4",
    "croniter>=3.0",
    "tomli-w>=1.0",
    "mcp>=2.1.1",
    "python-multipart>=0.0.32",
    "webauthn>=3.0.0",
]

[project.optional-dependencies]
# What the skills that drive a browser or draw pixels need, and nothing else does: no module under
# daedalus/ imports either of these. Playwright plus its Chromium is a third of the runtime image and
# most sessions never open a page, so both are an opt-in — the published ":browser" image tag carries
# them, the default one says they are not installed.
browser = [
    "playwright==1.62.0",  # webapp-testing, web-design-reviewer, accessibility, core-web-vitals
    "pillow>=11.0",        # canvas-design
]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "ruff>=0.6",
    "mypy>=1.11",
    "respx>=0.21",
]

[project.scripts]
daedalus = "daedalus.__main__:main"

[tool.uv.sources]
protocore = { path = "../protocore-exp", editable = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["daedalus"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["B008", "E501"]

[tool.ruff.lint.per-file-ignores]
"tests/unit/test_run_polish.py" = ["F811"]  # pytest fixtures imported from a sibling test module
"tests/unit/test_private_chat.py" = ["F811"]

[tool.mypy]
python_version = "3.12"
strict = false
ignore_missing_imports = true
