answer_language = "auto"

[model]
provider = "deepseek"
name = "deepseek-flash"
thinking = true
reasoning_effort = "medium"
chain = [
    "deepseek",
    "openrouter",
]
context_window = 128000

# Provider endpoints the bot can talk to. Every provider is an OpenAI-compatible client
# (chat/completions, tools, JSON mode, streaming); "kind" selects only the environment-key
# fallback and extra headers:
#   deepseek      -> falls back to DEEPSEEK_API_KEY
#   openrouter    -> falls back to OPENROUTER_API_KEY, adds the referer headers OpenRouter wants
#   vllm          -> falls back to VLLM_BASE_URL / VLLM_API_KEY (this is a plain vLLM server)
#   openai_compat -> generic self-hosted endpoint
# base_url is the OpenAI API root and usually ends in /v1 (e.g. http://192.0.2.10:9000/v1).
# A per-endpoint api_key set in this file wins over the environment key; leave it empty for
# self-hosted endpoints that need no key. The Mini App (Settings -> Providers) edits these
# entries live, lists a server's models from its /models endpoint, and never shows stored keys.

[providers.deepseek]
kind = "deepseek"
base_url = "https://api.deepseek.com"
default_model = "deepseek-flash"
supports_images = false
supports_thinking = true
timeout_seconds = 600.0

[providers.deepseek.pricing]

[providers.openrouter]
kind = "openrouter"
base_url = "https://openrouter.ai/api/v1"
default_model = "deepseek/deepseek-v4-flash"
supports_images = true
supports_thinking = true
timeout_seconds = 600.0

[providers.openrouter.pricing]

# OpenCode Go (https://opencode.ai/go): OPENCODE_API_KEY in keyproxy.env, one key for all of its models.
[providers.opencode]
kind = "opencode"
base_url = "http://keyproxy:3200/opencode"
timeout_seconds = 900.0

[providers.vllm]
kind = "vllm"
base_url = ""            # empty = use VLLM_BASE_URL from the environment
default_model = ""
supports_images = false
supports_thinking = false
timeout_seconds = 600.0

[providers.vllm.pricing]

[vision]
provider = "openrouter"
model = "qwen/qwen3.7-flash"

[mcp.servers]

[self_change]
approval = "manual"
auto_rebuild = true

[limits]
max_iterations = 200
tool_timeout_seconds = 900.0
# max_run_minutes = 0     # active minutes per run, 0 = none
# max_run_tokens = 0      # tokens per run, every call counted, 0 = none

[tools.exec]
# The most one tool call may return to the model. Exec streams past it into a spill file and
# shows a head and a tail; Read pages; every other tool is clipped to it.
max_output_chars = 60000

[tools.results]
# What happens to a result the agent has already moved past. max_output_chars above bounds ONE
# call; these bound the twenty results the request carries again on every turn.
fresh_count = 6            # the newest results, always shown whole
stale_max_chars = 2000     # head kept of an older result longer than this
trim_batch_chars = 40000   # trimmable excess that must build up before any trimming happens
# The stored history keeps every result whole; only the copy sent to the model is cut.

[policy]
# Hosts the agent may reach without asking ("example.com" or "*.example.com"); empty = every host, logged.
egress_allow = []
# [[policy.rules]]
# tool = "Exec"
# pattern = "\\bpip install\\b(?!.*--user)"
# action = "deny"           # deny | ask; "allow" only lifts an ask, never a built-in denial
# note = "no global installs"

[hooks]
# Operator scripts around the agent's actions: JSON on stdin; pre_tool exits 2 to refuse, prints JSON with "arguments" to rewrite.
pre_tool = ""
post_tool = ""
run_finished = ""

[memory]
extract_after_run = false

[balance]
enabled = true
poll_seconds = 60
thresholds_usd = [
    5.0,
    2.0,
    0.5,
]

[board]
wip_limit = 3              # tasks one agent (with its subagents) may hold in 'doing' at once
stale_hours = 6            # a 'doing' task whose session went quiet this long is handed back to 'todo'

[ops]
# provider_retry_max_attempts = 6      # runs driven again after the model provider failed one in a row; 0 = none
# provider_retry_base_seconds = 30.0   # the first wait; it doubles each time up to provider_retry_max_seconds
# provider_retry_max_seconds = 600.0

[scheduler]
topic_mode = "per_task"
catch_up_missed = true

[telegram]
forum_chat_id = 0
general_topic_id = 0
status_edit_interval_seconds = 1.0
inbound_merge_window_seconds = 1.5
verbosity = 1
