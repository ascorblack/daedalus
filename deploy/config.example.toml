answer_language = "auto"

# Which model opens a new session, and which ones stand in when it fails.
# A fresh install has NO model: a provider endpoint is not a model, and which one to run — and pay
# for — is yours to pick. The app asks at first login (Settings -> Models -> Add a model) and writes
# the [presets.*] entry for you. The examples below are documentation, not defaults: uncomment one
# only if you would rather type it than click it, and make sure its provider has a key.
[model]
preset = ""              # the preset id below that opens new sessions; empty = the first one
chain = []               # preset ids tried in order after the default one fails

# One preset per provider kind, to show the shape of an entry. Every field has a default;
# provider and model are the only ones a preset cannot do without.
# [presets."deepseek.deepseek-flash"]
# provider = "deepseek"
# model = "deepseek-flash"
# label = ""                 # what the app shows; empty = "provider/model"
# thinking = true
# reasoning_effort = "medium"  # low | medium | high | xhigh
# images = false             # the model accepts pictures (ImageView, photos in chat)
# context_window = 128000    # history a run may hold before it is compacted
# max_output_tokens = 32000  # cap on one reply; thinking tokens count against it

# [presets."openrouter.deepseek-v4-flash"]
# provider = "openrouter"
# model = "deepseek/deepseek-v4-flash"
# images = true

# [presets."opencode.glm-5.3-flash"]
# provider = "opencode"
# model = "glm-5.3-flash"
# label = "GLM-5.3 Flash (OpenCode Go)"
# reasoning_effort = "high"
# context_window = 200000

# [presets."vllm.Qwen3.8"]
# provider = "vllm"
# model = "Qwen3.8"
# thinking = false

# [presets."llamacpp.local-model"]
# provider = "llamacpp"
# model = "local-model"       # discovered from the server; editable when the server cannot list it
# thinking = false
# reasoning_effort = "low"    # Bonsai: low | medium | xhigh (high is sent as xhigh)
# context_window = 128000      # discovered from /props when that endpoint is exposed
# max_output_tokens = 8192     # thinking counts against this; a 32k cap lets a stuck local write run to the wall

# A subscription endpoint (Claude Code, Codex, SuperGrok) is a generic openai_compat client
# behind the key proxy; the preset looks like any other.
# [presets."claude.sonnet-5"]
# provider = "claude"
# model = "claude-sonnet-5"
# label = "Claude Sonnet 5 (Claude Code subscription)"
# reasoning_effort = "high"
# images = true
# context_window = 200000

# Provider endpoints the bot can talk to. Every provider is an OpenAI-compatible client
# (chat/completions, tools, JSON mode, streaming); "kind" selects only the environment-key
# fallback and extra headers:
#   deepseek      -> falls back to DEEPSEEK_API_KEY
#   openrouter    -> falls back to OPENROUTER_API_KEY, adds the referer headers OpenRouter wants
#   vllm          -> falls back to VLLM_BASE_URL / VLLM_API_KEY (this is a plain vLLM server)
#   llamacpp      -> a llama.cpp server; local calls are always recorded at zero cost
#   openai_compat -> generic self-hosted endpoint
# base_url is the OpenAI API root and usually ends in /v1 (e.g. http://<host>:<port>/v1).
# A per-endpoint api_key set in this file wins over the environment key; leave it empty for
# self-hosted endpoints that need no key. The Mini App (Settings -> Providers) edits these
# entries live, lists a server's models from its /models endpoint, and never shows stored keys.

[providers.deepseek]
kind = "deepseek"
base_url = "https://api.deepseek.com"
timeout_seconds = 600.0

[providers.deepseek.pricing]

[providers.openrouter]
kind = "openrouter"
base_url = "https://openrouter.ai/api/v1"
timeout_seconds = 600.0

[providers.openrouter.pricing]

# OpenCode Go (https://opencode.ai/go): OPENCODE_API_KEY in keyproxy.env, one key for all of its models.
[providers.opencode]
kind = "opencode"
base_url = "http://keyproxy:3200/opencode"
timeout_seconds = 900.0

[providers.vllm]
kind = "vllm"
base_url = ""            # empty = use VLLM_BASE_URL from the environment
timeout_seconds = 600.0

[providers.vllm.pricing]

# llama.cpp needs no key unless the server was started with one. Its /props endpoint supplies the
# model id, context window, tool and image support, slot count, build and sleep state; with /props
# hidden or absent, /v1/models still supplies the model id and any values it publishes, and the
# preset values above remain editable.
[providers.llamacpp]
kind = "llamacpp"
name = "Local llama.cpp"
base_url = "http://127.0.0.1:8080/v1"
api_key = ""
timeout_seconds = 600.0
# temperature = 0.6  # omit to use the host default; pin for local sampling

# The agent's eyes: a preset with images = true answers questions about pictures, so the main
# context never carries pixels. Empty = the first image-capable preset, if there is one.
[vision]
preset = ""

[mcp.servers]

# Projects are not in this file. A project is a folder you add in the app, and it is a row in the
# database — its name, its root and its own settings (today: whether the root is snapshotted before
# every turn, off by default, because a project root is your repository and not a scratch
# directory). They are edited where they are made: Projects in the app's rail, or the API.

# Whether this installation may change its own code, and how.
#   auto   (the default) work it out at startup from what is really here
#   server a worktree, a pull request you approve, a merge, a rebuild
#   local  the checkout this installation runs from, edited in place and applied by a restart
#   off    not at all: no tools, no API, no screen, nothing in the prompt about it
# An explicit value wins over the resolution, and `daedalus doctor` says what it is missing.
# A change of mode takes effect on the next restart.
[self_change]
mode = "auto"
approval = "manual"
auto_rebuild = true

[limits]
max_iterations = 200
tool_timeout_seconds = 900.0
# max_run_minutes = 0     # active minutes per run, 0 = none
# max_run_tokens = 0      # tokens per run, every call counted, 0 = none

[tools.exec]
# The most one tool call may return to the model. Exec streams past it into a spill file and
# shows a head and a tail; Read pages; every other tool is clipped to it.
max_output_chars = 60000
# Whether Exec runs inside bubblewrap: the filesystem read-only except the session's own
# directory, a private /tmp, a PID namespace of its own. "workspace" is the default on a native
# installation with bwrap on the machine — there is no container there to be the wall instead —
# and "off" in a container, where there is. A sandbox that is configured and unavailable refuses
# the command rather than running it unsandboxed.
# sandbox = "off"                # off | workspace
# sandbox_extra_writable = []    # absolute paths the sandbox may write beside the workspace

[tools.results]
# What happens to a result the agent has already moved past. max_output_chars above bounds ONE
# call; these bound the twenty results the request carries again on every turn.
fresh_count = 6            # the newest results, always shown whole
stale_max_chars = 2000     # head kept of an older result longer than this
trim_batch_chars = 40000   # trimmable excess that must build up before any trimming happens
# The stored history keeps every result whole; only the copy sent to the model is cut.

[policy]
# Hosts the agent may reach without asking ("example.com" or "*.example.com"); empty = every host, logged.
egress_allow = []
# [[policy.rules]]
# tool = "Exec"
# pattern = "\\bpip install\\b(?!.*--user)"
# action = "deny"           # deny | ask; "allow" only lifts an ask, never a built-in denial
# note = "no global installs"

[hooks]
# Operator scripts around the agent's actions: JSON on stdin; pre_tool exits 2 to refuse, prints JSON with "arguments" to rewrite.
pre_tool = ""
post_tool = ""
run_finished = ""

[memory]
extract_after_run = false

[balance]
enabled = true
poll_seconds = 60
thresholds_usd = [
    5.0,
    2.0,
    0.5,
]

[board]
wip_limit = 3              # tasks one agent (with its subagents) may hold in 'doing' at once
stale_hours = 6            # a 'doing' task whose session went quiet this long is handed back to 'todo'

[terminals]
# running_cap = 20             # terminals running at once across the machine, both environments; an agent's
#                              # launch waits for a place, the operator may go past it after confirming
# agent_launch_wait_seconds = 600
# exited_retention_hours = 72  # how long an ended terminal stays listed with its last screen
# audit_retention_days = 90
# shell = ""                   # empty = the environment's login shell
# agent_reads_host = false     # whether a session's agent may read the host terminals of its own session

[harness]
# no_signal_after_s = 300          # a working CLI staff member silent this long has its screen checked
# ready_timeout_s = 30             # a launched CLI that has not said it is ready by then is shown as failed
# ask_hold_s = 300                 # how long a staff member's question waits for the orchestrator's answer
# report_hold_s = 15               # how long a staff member's report waits for the team's word on it
# permission_hold_s = 300          # a CLI's own permission or question held for an answer from the app
# team_hello_s = 30                # a CLI's team tools must say they loaded this soon after it is ready
# pointer_threshold_bytes = 16384  # longer messages go as a file with a one-line pointer
# allow_untested = true            # launch a CLI version outside the tested range once its self-check passed
# self_check_model_turn = true     # the check after an update sends one tiny prompt on the cheapest model
# catalog_ttl_s = 21600            # how often each environment is checked for installed CLIs, sign-in, agents and models
# latest_ttl_s = 21600             # how long a known latest version is trusted
# update_timeout_s = 600
# install_timeout_s = 900
# opencode_port_range = "18300-18399"

[ops]
# provider_retry_max_attempts = 6      # runs driven again after the model provider failed one in a row; 0 = none
# provider_retry_base_seconds = 30.0   # the first wait; it doubles each time up to provider_retry_max_seconds
# provider_retry_max_seconds = 600.0

# Workspace snapshots: one is taken before every operator turn and after every run, into a hidden
# git repository in the workspace, and "revert to this turn" puts the files back from it.
# checkpoint_max_gb bounds one workspace (a bigger one is not snapshotted at all, and revert there
# undoes the history only); the three below bound the stores together, oldest dropped first when
# either bound is passed. A session always keeps its newest checkpoint_keep_last whatever they say.
# The maintenance tick applies them every ops.db_maintenance_minutes;
# `python -m daedalus db checkpoints-prune` applies them now and prints what it freed.
# checkpoint_max_gb = 2.0
# checkpoint_keep_days = 30
# checkpoint_total_max_gb = 2.0         # 0 = no size bound
# checkpoint_keep_last = 50

[scheduler]
topic_mode = "per_task"
catch_up_missed = true

[telegram]
forum_chat_id = 0
general_topic_id = 0
status_edit_interval_seconds = 1.0
inbound_merge_window_seconds = 1.5
verbosity = 1

# The voice page: the operator speaks to a small fast model (the concierge) which answers itself
# when it can and hands real work to agent sessions. Pick a model that replies in a second or two;
# a thinking model makes the conversation wait. Speech in comes from the browser's own recognition,
# with the [asr] endpoint as the fallback for browsers that have none.
[voice]
enabled = true
preset = ""              # a preset id; empty = the default preset

# What a delegated agent says while it works ("found the problem, testing the fix") is relayed to the
# concierge as well as its final answer — only while the page is open, coalesced over a window, and at
# most one per agent per gap, so a talkative agent cannot take the conversation over. The last cap is
# the fleet's: the gap bounds one agent, and twenty agents obeying it is still twenty spoken turns a
# minute, so past the cap a line is dropped rather than queued — the next paragraph supersedes it.
progress = true
progress_window_seconds = 20     # the newest line of an agent replaces the older ones for this long
progress_min_gap_seconds = 60    # the floor between two of the same agent's interims
progress_max_per_minute = 3      # interims relayed in a minute across all the agents together

# Reading the answer out loud. Empty url and provider = the browser's own synthesiser.
# Any OpenAI-compatible /audio/speech endpoint works: a hosted one, or a local server.
[voice.tts]
# How the answer is spoken, in the order it is tried: a voice downloaded onto this machine, then the
# endpoint below, then the browser's own synthesiser. Pick a voice in Settings -> Voice rather than
# by hand — the id has to be one the catalog knows and the files have to be downloaded first.
local_voice = ""         # a catalog id: "ru-dmitri", "en-amy", "en-kokoro", ... Empty = nothing local
local_speaker = ""       # a named speaker inside a multi-voice model ("af_sarah", "expr-voice-4-f")
local_speed = 1.0        # 0.5 - 2.0; 1.0 is the voice as it was trained
local_threads = 2
provider = ""            # a provider id from [providers]; its base URL and key are used
url = ""                 # or an endpoint of its own, e.g. "http://speech:8880/v1"
api_key = ""
model = "gpt-4o-mini-tts"
voice = "alloy"
format = "mp3"           # mp3 | opus | pcm
