# docker compose -f deploy/compose.yaml --env-file .env up -d
#
# Secrets: provider keys do NOT belong in .env — .env sits inside the checkout, which is bind-mounted
# into the agent container. Put them in ../../daedalus-secrets/keyproxy.env (outside every mount, chmod 600):
#   DEEPSEEK_API_KEY=…  OPENROUTER_API_KEY=…  OPENCODE_API_KEY=…  OPENAI_API_KEY=…  KEYPROXY_UPSTREAM_<NAME>=…  KEYPROXY_KEY_<NAME>=…
#   Search APIs (Serper, Keenable, Tavily, Exa, Perplexity) are upstreams too: see deploy/keyproxy.env.example.
#   KEYPROXY_USD_PER_DAY=20   (the proxy's own daily cap, read from the database; independent of the supervisor's flag)
# What the key proxy does and does not buy: the agent process never holds a provider key, so a leak through a
# log line, a header echo or a careless tool result cannot happen. It is not a wall against a deliberate
# self-modification: the agent can still edit this file and ask the rebuilder for a new image. Review the
# pull requests it opens.
#
# Volumes:
#   ./..                  -> /srv/daedalus      the bot repository (this checkout)
#   ../protocore-exp      -> /srv/protocore-exp the core repository
#   daedalus-state        -> /srv/state         database, blobs, secrets, known-good history
#   daedalus-workspaces   -> /srv/workspaces    per-session working directories
#   daedalus-worktrees    -> /srv/worktrees     the worktrees self-development cuts off the two repositories
#     Beside the state volume rather than inside it: the state directory is sealed against the agent and a
#     worktree is where the agent's own changes are written.
#   daedalus-venv         -> /srv/venv          the virtualenv, seeded from the image on first start
#     A named volume rather than the container's writable layer: replacing the container would otherwise
#     throw away every `uv sync` and the next start would install everything again. Docker seeds an empty
#     named volume from what the image holds at that path, so an image that bakes the virtualenv still
#     starts with it. The environment carries a stamp of the dependency files it was built from, so a sync
#     runs afterwards only when the checkout declares something the environment was not built for — which
#     covers a change that landed here, and a hand update the volume would otherwise outlive silently.
#   telegram-bot-api-data -> /var/lib/telegram-bot-api  files the local Bot API server stores
#   terminal-run          -> /run/daedalus-terminals    the terminal daemon's socket and token, shared
#                                                       by the agent and the terminals service
#   terminals-home        -> /root (terminals only)     the terminals' home: CLI installs, their logins,
#                                                       shell history. Never mounted into the agent.
#   terminals-state       -> /var/lib/ptyd (terminals only)  the daemon's journal, launches, logs
#   ../../daedalus-host-terminals -> /run/daedalus-host-terminals  the host terminal's socket and
#                                                       token (DAEDALUS_HOST_TERMINALS_DIR overrides it)
#
# Host terminal (optional). `bash deploy/setup.sh` can install `ptyd` on the server itself as a
# systemd user unit of the operator's (deploy/ptyd/daedalus-ptyd.service): a shell on the server as
# the operator, opened from the app. Its run directory is a sibling of this checkout, and it is
# mounted into the agent whether or not the unit is installed: an empty directory reads as "not
# installed", and installing or removing the unit later needs no change here and no recreate,
# because the socket appears in a directory that is already mounted. setup.sh creates the directory
# as the operator; left to Docker, it would be created as root and the unit could not write to it.
#
# Networks: "telegram" (bot ⇄ local Bot API), "keys" (bot ⇄ key proxy), "search" (bot ⇄ SearXNG),
# "terminals" (the terminals service's own way out, with no route to the key proxy or SearXNG).
#
# Terminals. The `terminals` service is the same image started as `ptyd`, the daemon that owns the
# container terminals of the app. It is a service of its own so that the terminals outlive the agent:
# `docker restart deploy-daedalus-1`, and the rebuilder's `up -d --no-deps daedalus`, never touch it.
# Recreating it — `docker compose up -d terminals` after the image changed, or the update button the
# app shows when the image holds a newer daemon — ends every container terminal, and the app says how
# many before it does. The first deploy that has this service needs `docker compose ... up -d --build`
# (not a restart of the agent's container): the service is new, the agent gains a volume, and an image
# built before this service existed has no daemon in it to start.
# A project folder mounted into the agent is mounted into `terminals` as well, at the same absolute
# path, so a path means the same thing in a terminal as it does to the agent.
#
# One image: the agent's. The key proxy is a second container from it with another command, and the
# services that are not the agent are behind profiles, so an install pulls one image and runs two
# containers. The profiles, none of them on by default:
#   --profile telegram   the local Bot API server, for files over 20 MB. Needs TELEGRAM_API_ID/HASH;
#                        with no bot token the bot never calls it, so its absence costs nothing.
#   --profile search     a self-hosted SearXNG. WebSearch answers without it (DuckDuckGo directly);
#                        with it running, it is the fallback the tool walks to.
#   --profile selfdev    the rebuilder, which is the only container that can reach Docker. It exists
#                        to build a new agent image when the agent changes one; an installation that
#                        does not develop itself never needs it.
services:
  daedalus:
    stop_grace_period: 40s  # the supervisor drains the bot for 25 s before killing it; Docker must wait longer
    # tools.exec.sandbox = workspace (bubblewrap) needs the container to create namespaces, which Docker's
    # default seccomp profile forbids. Opt in by uncommenting; both widen what a process in the container may do.
    cap_add: [SYS_ADMIN]
    security_opt: ["seccomp=unconfined", "apparmor=unconfined"]
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    image: daedalus:local
    restart: unless-stopped
    env_file:
      - ../.env
    environment:
      # Only ever dialled when a bot token is set, which is also when the telegram profile is up.
      TELEGRAM_API_BASE: http://telegram-bot-api:8081
      TELEGRAM_LOCAL_MODE: "true"
      STATE_DIR: /srv/state
      WORKSPACES_DIR: /srv/workspaces
      BOT_REPO_DIR: /srv/daedalus
      CORE_REPO_DIR: /srv/protocore-exp
      SUPERVISOR_SOCKET: /run/daedalus/supervisor.sock
      DAEDALUS_REBUILD_TRIGGER_DIR: /run/daedalus-rebuild
      # off | local | server | auto. The supervisor resolves it the way the bot does, because it decides
      # how a restart behaves before the bot is up: with a remote it pulls, without one it preflights the
      # commit the agent left in the checkout.
      DAEDALUS_SELFDEV_MODE: ${DAEDALUS_SELFDEV_MODE:-auto}
      USD_PER_DAY: ${USD_PER_DAY:-20}
      API_HOST: 0.0.0.0
      API_PORT: ${API_PORT:-8765}
      SERVICES_PORT_RANGE: ${SERVICES_PORT_RANGE:-8100-8119}
      SERVICES_PUBLIC_HOST: ${SERVICES_PUBLIC_HOST:-}
      # The terminals service's run directory (the terminal-run volume) and the ports it publishes.
      TERMINALS_CONTAINER_DIR: /run/daedalus-terminals
      # The host terminal's run directory: empty until the systemd user unit is installed on the host.
      TERMINALS_HOST_DIR: /run/daedalus-host-terminals
      TERMINALS_PORT_RANGE: ${TERMINALS_PORT_RANGE:-8120-8139}
      GITHUB_DAEDALUS_TOKEN: ${GITHUB_DAEDALUS_TOKEN:-}
      DAEDALUS_GITHUB_ORG: ${DAEDALUS_GITHUB_ORG:-}
      # Provider keys live in the key proxy, not here (see the note at the top of this file).
      DEEPSEEK_API_KEY: ""
      OPENROUTER_API_KEY: ""
      OPENAI_API_KEY: ""
    volumes:
      # The two repositories the agent may change through pull requests. Rebuild resets them to origin/main:
      # keep this checkout for the bot only, not for your own uncommitted work.
      - ..:/srv/daedalus
      - ../../protocore-exp:/srv/protocore-exp
      # The supervisor and the governance rules are read-only inside the container: the agent can change
      # them only through a reviewed pull request, never from a running session.
      - ../launcher:/opt/launcher:ro
      - ../GOVERNANCE.md:/srv/daedalus/GOVERNANCE.md:ro
      - daedalus-state:/srv/state
      - daedalus-workspaces:/srv/workspaces
      - daedalus-worktrees:/srv/worktrees
      - daedalus-venv:/srv/venv
      # SSH material for servers the agent may use (keys, config, known_hosts), kept outside every repository;
      # the supervisor copies it into /root/.ssh with the permissions ssh insists on. Describe each host in a
      # comment above its `Host` line: the description goes into the agent's system prompt.
      - ${DAEDALUS_SSH_DIR:-../../daedalus-secrets/ssh}:/srv/ssh:ro
      - telegram-bot-api-data:/var/lib/telegram-bot-api
      - rebuild-trigger:/run/daedalus-rebuild
      # The terminal daemon's socket and token. The directory is sealed from the agent's commands;
      # only the app's own process opens it.
      - terminal-run:/run/daedalus-terminals
      # The host terminal's socket and token, from the server itself. Sealed the same way: its token
      # opens a shell on the server as the operator.
      - ${DAEDALUS_HOST_TERMINALS_DIR:-../../daedalus-host-terminals}:/run/daedalus-host-terminals
    ports:
      - "127.0.0.1:${API_PORT:-8765}:${API_PORT:-8765}"
      # Services the agent hosts (ServiceStart) listen in this range; published on every interface so the
      # operator reaches them from the LAN at SERVICES_PUBLIC_HOST:<port>.
      - "${SERVICES_PORT_RANGE:-8100-8119}:${SERVICES_PORT_RANGE:-8100-8119}"
    networks: [telegram, keys, search]
    depends_on:
      keyproxy:
        condition: service_healthy
      # Only when the "search" profile is on: without it WebSearch goes to DuckDuckGo directly.
      searxng:
        condition: service_started
        required: false

  # The container terminals: `ptyd` from the agent's own image, owning every shell and CLI the app
  # opens in the container environment. Why it is a service apart, and what recreating it costs, is
  # in the header of this file.
  terminals:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    image: daedalus:local
    restart: unless-stopped
    # Reaps what the terminals leave behind: a shell's orphaned background job is reparented to
    # pid 1, and ptyd is not an init.
    init: true
    # A terminal's sandbox (bubblewrap: the filesystem read-only, the project's folders writable,
    # ptyd's token hidden) needs the container to create namespaces, which Docker's default seccomp
    # and AppArmor profiles forbid. The same widening the agent's container accepts for Exec: without
    # it the sandbox toggle is offered as unavailable and terminals open unsandboxed.
    cap_add: [SYS_ADMIN]
    security_opt: ["seccomp=unconfined", "apparmor=unconfined"]
    entrypoint: ["/usr/local/bin/ptyd"]
    command: ["serve", "--env", "container", "--run-dir", "/run/daedalus-terminals",
              "--state-dir", "/var/lib/ptyd", "--home", "/root"]
    # ptyd hangs up every terminal on SIGTERM and kills what is left two seconds later.
    stop_grace_period: 10s
    # Root, like the agent: the workspaces are the agent's files, written as root, and a terminal
    # that could not edit them would need a chown regime of its own.
    environment:
      HOME: /root
      # The command-line agents and the pinned Node the Harnesses screen installs live in the home
      # volume, so an image rebuild keeps them: the native installers put theirs in ~/.local/bin, npm
      # into ~/.npm-global. Both come first, so the installed version is the one every terminal and
      # every version check finds.
      PATH: /root/.local/bin:/root/.npm-global/bin:/srv/venv/bin:/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin
      NPM_CONFIG_PREFIX: /root/.npm-global
    healthcheck:
      test: ["CMD", "test", "-S", "/run/daedalus-terminals/ptyd.sock"]
      interval: 30s
      timeout: 3s
      start_period: 5s
    volumes:
      # The same path as in the agent's container, so a workspace path means one folder on both sides.
      - daedalus-workspaces:/srv/workspaces
      # CLI installs, their logins and transcripts, shell history. Docker seeds it from the image's
      # /root on first use. Never mounted into the agent: a login made in a terminal is not the
      # agent's to read.
      - terminals-home:/root
      - terminals-state:/var/lib/ptyd
      - terminal-run:/run/daedalus-terminals
    ports:
      # A server started in a container terminal (a dev server, a preview) listens in this range and
      # is published on every interface, like the agent's own range, so it is reached from the LAN at
      # SERVICES_PUBLIC_HOST:<port>. Apart from the agent's range: both are published, and one port
      # can be published by one container only.
      - "${TERMINALS_PORT_RANGE:-8120-8139}:${TERMINALS_PORT_RANGE:-8120-8139}"
    # Its own network, for the way out: a terminal has no business with the key proxy or SearXNG.
    networks: [terminals]

  # A metasearch over Bing, Brave, DuckDuckGo, Google (CSE), Mojeek and Wikipedia with a JSON API,
  # reachable only from the agent container. Settings in deploy/searxng/settings.yml. Behind the
  # "search" profile and off by default: it is 382 MB for a better version of a search WebSearch can
  # already do keylessly, so it is a choice, not a prerequisite. Started, it becomes the fallback the
  # tool walks to; the agent picks it (or a paid API through the key proxy) as the backend in the Mini App.
  searxng:
    image: searxng/searxng:2026.9.8-3fdc6d753
    profiles: [search]
    restart: unless-stopped
    environment:
      SEARXNG_BASE_URL: http://searxng:8080/
      SEARXNG_SECRET: ${SEARXNG_SECRET:-daedalus-searxng}
      SEARXNG_LIMITER: "false"
      SEARXNG_PUBLIC_INSTANCE: "false"
    volumes:
      - ./searxng/settings.yml:/etc/searxng/settings.yml:ro
      # Engine session tokens (DuckDuckGo's VQD and the like) live here; keeping them across restarts makes
      # the first query after a restart look like the hundredth, not like a new bot.
      - searxng-cache:/var/cache/searxng
    networks: [search]

  # Holds the provider keys and injects them into upstream calls; refuses model calls once the daily
  # budget is spent (the supervisor's flag or its own read of the database). Reachable only from the
  # agent container over the private "keys" network; it holds nothing but the keys it injects.
  keyproxy:
    # The agent's image, started as the key proxy instead of as the agent: proxy.py needs httpx and
    # aiohttp, which the agent's virtualenv already has, and a second image bought nothing. The
    # isolation is the container, not the image — its own process, its own network, its own uid, and
    # an env_file the agent's container never sees. deploy/keyproxy/Dockerfile is still there for
    # anyone who wants the standalone image; it is no longer published.
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    image: daedalus:local
    restart: unless-stopped
    # The image's entrypoint is the supervisor, which is not what this container is; it is replaced
    # rather than appended to.
    entrypoint: ["/srv/venv/bin/python"]
    command: ["/opt/keyproxy/proxy.py"]
    healthcheck:
      test: ["CMD", "/srv/venv/bin/python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:3200/healthz', timeout=2).status == 200 else 1)"]
      interval: 15s
      timeout: 3s
      start_period: 5s
    # The operator's uid: the CLI login files below are 0600 and the proxy refreshes them in place.
    user: "${DAEDALUS_KEYPROXY_UID:-1000}:${DAEDALUS_KEYPROXY_GID:-1000}"
    env_file:
      - ${DAEDALUS_SECRETS_FILE:-../../daedalus-secrets/keyproxy.env}
    environment:
      HOME: /home/keyproxy
      PYTHONPATH: /opt/keyproxy
      KEYPROXY_PORT: "3200"
      # Every interface here is the container's own, on a network only the agent is on; the proxy
      # binds the loopback address unless it is told otherwise, which is the right default on a
      # machine and the wrong one in here.
      KEYPROXY_HOST: 0.0.0.0
      KEYPROXY_BUDGET_FLAG: /srv/state/BUDGET_EXCEEDED
      KEYPROXY_BUDGET_DB: /srv/state/daedalus.sqlite
      KEYPROXY_AGENT_API: http://daedalus:${API_PORT:-8765}
      KEYPROXY_CODEX_AUTH: /home/keyproxy/.codex/auth.json
      KEYPROXY_GROK_AUTH: /home/keyproxy/.grok/auth.json
      KEYPROXY_CLAUDE_AUTH: /home/keyproxy/.claude/.credentials.json
    volumes:
      - daedalus-state:/srv/state:ro
      # Subscriptions: the CLIs' logins, served as /codex/v1, /grok/v1 and /claude/v1.
      - ${DAEDALUS_HARNESS_HOME:-~}/.codex:/home/keyproxy/.codex
      - ${DAEDALUS_HARNESS_HOME:-~}/.grok:/home/keyproxy/.grok
      - ${DAEDALUS_HARNESS_HOME:-~}/.claude:/home/keyproxy/.claude
    networks: [keys]

  # The only container that can talk to Docker. It rebuilds and replaces the agent container when
  # the supervisor drops a trigger file; the agent container itself never sees the docker socket.
  # It needs no network of its own: the daemon does the building and pulling. Behind the "selfdev"
  # profile: a change that needs a new image is a change to the image's own recipe, which only an
  # installation that develops the server itself ever makes.
  #
  # It belongs to server self-development: its presence is one of the prerequisites the capability
  # probe looks for (`[self_change] mode`, daedalus/host/capabilities.py). An installation that sets
  # the mode to "local" or "off" never drops a trigger file, and can leave this service out.
  rebuilder:
    image: docker:cli
    profiles: [selfdev]
    restart: unless-stopped
    network_mode: none
    working_dir: ${DAEDALUS_COMPOSE_PROJECT_DIR:-/project}
    environment:
      COMPOSE_FILE: ${DAEDALUS_COMPOSE_FILE:-/project/deploy/compose.yaml}
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - ${DAEDALUS_COMPOSE_PROJECT_DIR:-..}:${DAEDALUS_COMPOSE_PROJECT_DIR:-/project}
      - ${DAEDALUS_CORE_PROJECT_DIR:-../../protocore-exp}:${DAEDALUS_CORE_PROJECT_DIR:-/project/../protocore-exp}
      - rebuild-trigger:/run/daedalus-rebuild
    # The heartbeat is what makes this a rebuild channel the bot may promise: the compose file always
    # names this service, so its presence in the file says nothing about whether anything is running.
    command: [sh, deploy/rebuild.sh]

  # Files up to 2 GB, instead of Telegram's 20 MB. Only started with `--profile telegram`.
  telegram-bot-api:
    image: aiogram/telegram-bot-api:latest
    profiles: [telegram]
    restart: unless-stopped
    environment:
      TELEGRAM_API_ID: ${TELEGRAM_API_ID}
      TELEGRAM_API_HASH: ${TELEGRAM_API_HASH}
      TELEGRAM_LOCAL: "true"
    volumes:
      - telegram-bot-api-data:/var/lib/telegram-bot-api
    networks: [telegram]

networks:
  telegram:
  keys:
  search:
  terminals:

volumes:
  daedalus-state:
  daedalus-workspaces:
  daedalus-worktrees:
  daedalus-venv:
  telegram-bot-api-data:
  rebuild-trigger:
  searxng-cache:
  terminal-run:
  terminals-home:
  terminals-state:
