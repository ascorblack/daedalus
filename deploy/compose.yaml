# docker compose -f deploy/compose.yaml --env-file .env up -d
#
# Volumes:
#   ./..                  -> /srv/daedalus      the bot repository (this checkout)
#   ../protocore-exp      -> /srv/protocore-exp the core repository
#   daedalus-state        -> /srv/state         database, blobs, secrets, known-good history
#   daedalus-workspaces   -> /srv/workspaces    per-session working directories
#   telegram-bot-api-data -> /var/lib/telegram-bot-api  files the local Bot API server stores
services:
  daedalus:
    stop_grace_period: 40s  # the supervisor drains the bot for 25 s before killing it; Docker must wait longer
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    image: daedalus:local
    restart: unless-stopped
    env_file:
      - ../.env
    environment:
      TELEGRAM_API_BASE: http://telegram-bot-api:8081
      TELEGRAM_LOCAL_MODE: "true"
      STATE_DIR: /srv/state
      WORKSPACES_DIR: /srv/workspaces
      BOT_REPO_DIR: /srv/daedalus
      CORE_REPO_DIR: /srv/protocore-exp
      SUPERVISOR_SOCKET: /run/daedalus/supervisor.sock
      DAEDALUS_REBUILD_TRIGGER_DIR: /run/daedalus-rebuild
      USD_PER_DAY: ${USD_PER_DAY:-20}
      API_HOST: 0.0.0.0
      API_PORT: ${API_PORT:-8765}
      # Provider keys live in the key proxy, not here: a change to the agent's own code cannot read them.
      DEEPSEEK_API_KEY: ""
      OPENROUTER_API_KEY: ""
      OPENAI_API_KEY: ""
    volumes:
      # The two repositories the agent may change through pull requests. Rebuild resets them to origin/main:
      # keep this checkout for the bot only, not for your own uncommitted work.
      - ..:/srv/daedalus
      - ../../protocore-exp:/srv/protocore-exp
      # The supervisor and the governance rules are read-only inside the container: the agent can change
      # them only through a reviewed pull request, never from a running session.
      - ../launcher:/opt/launcher:ro
      - ../GOVERNANCE.md:/srv/daedalus/GOVERNANCE.md:ro
      - daedalus-state:/srv/state
      - daedalus-workspaces:/srv/workspaces
      - telegram-bot-api-data:/var/lib/telegram-bot-api
      - rebuild-trigger:/run/daedalus-rebuild
    ports:
      - "127.0.0.1:${API_PORT:-8765}:${API_PORT:-8765}"
    depends_on:
      - telegram-bot-api
      - keyproxy

  # Holds the provider keys and injects them into upstream calls; refuses model calls once the
  # daily budget flag exists. The agent container reaches providers only through it.
  keyproxy:
    build:
      context: ..
      dockerfile: deploy/keyproxy/Dockerfile
    image: daedalus-keyproxy:local
    restart: unless-stopped
    env_file:
      - ../.env
    environment:
      KEYPROXY_PORT: "3200"
      KEYPROXY_BUDGET_FLAG: /srv/state/BUDGET_EXCEEDED
    volumes:
      - daedalus-state:/srv/state:ro

  # The only container that can talk to Docker. It rebuilds and replaces the agent container when
  # the supervisor drops a trigger file; the agent container itself never sees the docker socket.
  rebuilder:
    image: docker:cli
    restart: unless-stopped
    working_dir: ${DAEDALUS_COMPOSE_PROJECT_DIR:-/project}
    environment:
      COMPOSE_FILE: ${DAEDALUS_COMPOSE_FILE:-/project/deploy/compose.yaml}
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - ${DAEDALUS_COMPOSE_PROJECT_DIR:-..}:${DAEDALUS_COMPOSE_PROJECT_DIR:-/project}
      - ${DAEDALUS_CORE_PROJECT_DIR:-../../protocore-exp}:${DAEDALUS_CORE_PROJECT_DIR:-/project/../protocore-exp}
      - rebuild-trigger:/run/daedalus-rebuild
    command: >
      sh -c 'while true; do
        if [ -f /run/daedalus-rebuild/rebuild ]; then
          rm -f /run/daedalus-rebuild/rebuild;
          echo "rebuilding daedalus image";
          docker compose -f "$$COMPOSE_FILE" --env-file .env up -d --build daedalus || echo "rebuild failed";
        fi;
        sleep 5;
      done'

  telegram-bot-api:
    image: aiogram/telegram-bot-api:latest
    restart: unless-stopped
    environment:
      TELEGRAM_API_ID: ${TELEGRAM_API_ID}
      TELEGRAM_API_HASH: ${TELEGRAM_API_HASH}
      TELEGRAM_LOCAL: "true"
    volumes:
      - telegram-bot-api-data:/var/lib/telegram-bot-api

volumes:
  daedalus-state:
  daedalus-workspaces:
  telegram-bot-api-data:
  rebuild-trigger:
