# docker compose -f deploy/compose.yaml --env-file .env up -d
#
# Secrets: provider keys do NOT belong in .env — .env sits inside the checkout, which is bind-mounted
# into the agent container. Put them in ../../daedalus-secrets/keyproxy.env (outside every mount, chmod 600):
#   DEEPSEEK_API_KEY=…  OPENROUTER_API_KEY=…  OPENAI_API_KEY=…  KEYPROXY_UPSTREAM_<NAME>=…  KEYPROXY_KEY_<NAME>=…
#   KEYPROXY_USD_PER_DAY=20   (the proxy's own daily cap, read from the database; independent of the supervisor's flag)
# What the key proxy does and does not buy: the agent process never holds a provider key, so a leak through a
# log line, a header echo or a careless tool result cannot happen. It is not a wall against a deliberate
# self-modification: the agent can still edit this file and ask the rebuilder for a new image. Review the
# pull requests it opens.
#
# Volumes:
#   ./..                  -> /srv/daedalus      the bot repository (this checkout)
#   ../protocore-exp      -> /srv/protocore-exp the core repository
#   daedalus-state        -> /srv/state         database, blobs, secrets, known-good history
#   daedalus-workspaces   -> /srv/workspaces    per-session working directories
#   telegram-bot-api-data -> /var/lib/telegram-bot-api  files the local Bot API server stores
services:
  daedalus:
    stop_grace_period: 40s  # the supervisor drains the bot for 25 s before killing it; Docker must wait longer
    # tools.exec.sandbox = workspace (bubblewrap) needs the container to create namespaces, which Docker's
    # default seccomp profile forbids. Opt in by uncommenting; both widen what a process in the container may do.
    # cap_add: [SYS_ADMIN]
    # security_opt: ["seccomp=unconfined"]
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    image: daedalus:local
    restart: unless-stopped
    env_file:
      - ../.env
    environment:
      TELEGRAM_API_BASE: http://telegram-bot-api:8081
      TELEGRAM_LOCAL_MODE: "true"
      STATE_DIR: /srv/state
      WORKSPACES_DIR: /srv/workspaces
      BOT_REPO_DIR: /srv/daedalus
      CORE_REPO_DIR: /srv/protocore-exp
      SUPERVISOR_SOCKET: /run/daedalus/supervisor.sock
      DAEDALUS_REBUILD_TRIGGER_DIR: /run/daedalus-rebuild
      USD_PER_DAY: ${USD_PER_DAY:-20}
      API_HOST: 0.0.0.0
      API_PORT: ${API_PORT:-8765}
      # Provider keys live in the key proxy, not here (see the note at the top of this file).
      DEEPSEEK_API_KEY: ""
      OPENROUTER_API_KEY: ""
      OPENAI_API_KEY: ""
    volumes:
      # The two repositories the agent may change through pull requests. Rebuild resets them to origin/main:
      # keep this checkout for the bot only, not for your own uncommitted work.
      - ..:/srv/daedalus
      - ../../protocore-exp:/srv/protocore-exp
      # The supervisor and the governance rules are read-only inside the container: the agent can change
      # them only through a reviewed pull request, never from a running session.
      - ../launcher:/opt/launcher:ro
      - ../GOVERNANCE.md:/srv/daedalus/GOVERNANCE.md:ro
      - daedalus-state:/srv/state
      - daedalus-workspaces:/srv/workspaces
      - telegram-bot-api-data:/var/lib/telegram-bot-api
      - rebuild-trigger:/run/daedalus-rebuild
    ports:
      - "127.0.0.1:${API_PORT:-8765}:${API_PORT:-8765}"
    networks: [telegram, keys]
    depends_on:
      telegram-bot-api:
        condition: service_started
      keyproxy:
        condition: service_healthy

  # Holds the provider keys and injects them into upstream calls; refuses model calls once the daily
  # budget is spent (the supervisor's flag or its own read of the database). Reachable only from the
  # agent container over the private "keys" network; it holds nothing but the keys it injects.
  keyproxy:
    build:
      context: keyproxy
    image: daedalus-keyproxy:local
    restart: unless-stopped
    # The operator's uid: the CLI login files below are 0600 and the proxy refreshes them in place.
    user: "1000:1000"
    env_file:
      - ${DAEDALUS_SECRETS_FILE:-../../daedalus-secrets/keyproxy.env}
    environment:
      HOME: /home/keyproxy
      KEYPROXY_PORT: "3200"
      KEYPROXY_BUDGET_FLAG: /srv/state/BUDGET_EXCEEDED
      KEYPROXY_BUDGET_DB: /srv/state/daedalus.sqlite
      KEYPROXY_CODEX_AUTH: /home/keyproxy/.codex/auth.json
      KEYPROXY_GROK_AUTH: /home/keyproxy/.grok/auth.json
    volumes:
      - daedalus-state:/srv/state:ro
      # Subscriptions (Codex = ChatGPT plan, Grok = SuperGrok): the CLIs' logins, served as /codex/v1 and /grok/v1.
      - ${DAEDALUS_HARNESS_HOME:-~}/.codex:/home/keyproxy/.codex
      - ${DAEDALUS_HARNESS_HOME:-~}/.grok:/home/keyproxy/.grok
    networks: [keys]

  # The operator's coding-agent subscriptions (claude, codex, grok) as a service. The CLIs and their
  # logins live here only; the agent hands tasks over HTTP (Delegate) and Grok doubles as a model
  # provider (http://harness:3300/grok/v1). Login on the host; the login directories are mounted rw
  # because the CLIs refresh their tokens. DAEDALUS_HARNESS_HOME is the host home that holds them.
  harness:
    build:
      context: harness
    image: daedalus-harness:local
    restart: unless-stopped
    user: "1000:1000"
    environment:
      HOME: /home/node
      HARNESS_PORT: "3300"
      HARNESS_ROOTS: /srv/workspaces:/srv/state/worktrees
    volumes:
      - ${DAEDALUS_HARNESS_HOME:-~}/.claude:/home/node/.claude
      - ${DAEDALUS_HARNESS_HOME:-~}/.claude.json:/home/node/.claude.json
      - ${DAEDALUS_HARNESS_HOME:-~}/.codex:/home/node/.codex
      - ${DAEDALUS_HARNESS_HOME:-~}/.grok:/home/node/.grok
      - daedalus-workspaces:/srv/workspaces
      - type: volume
        source: daedalus-state
        target: /srv/state/worktrees
        volume:
          subpath: worktrees
    networks: [keys]

  # The only container that can talk to Docker. It rebuilds and replaces the agent container when
  # the supervisor drops a trigger file; the agent container itself never sees the docker socket.
  # It needs no network of its own: the daemon does the building and pulling.
  rebuilder:
    image: docker:cli
    restart: unless-stopped
    network_mode: none
    working_dir: ${DAEDALUS_COMPOSE_PROJECT_DIR:-/project}
    environment:
      COMPOSE_FILE: ${DAEDALUS_COMPOSE_FILE:-/project/deploy/compose.yaml}
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - ${DAEDALUS_COMPOSE_PROJECT_DIR:-..}:${DAEDALUS_COMPOSE_PROJECT_DIR:-/project}
      - ${DAEDALUS_CORE_PROJECT_DIR:-../../protocore-exp}:${DAEDALUS_CORE_PROJECT_DIR:-/project/../protocore-exp}
      - rebuild-trigger:/run/daedalus-rebuild
    command: >
      sh -c 'while true; do
        if [ -f /run/daedalus-rebuild/rebuild ]; then
          rm -f /run/daedalus-rebuild/rebuild;
          echo "rebuilding daedalus image";
          docker compose -f "$$COMPOSE_FILE" --env-file .env up -d --build daedalus || echo "rebuild failed";
        fi;
        sleep 5;
      done'

  telegram-bot-api:
    image: aiogram/telegram-bot-api:latest
    restart: unless-stopped
    environment:
      TELEGRAM_API_ID: ${TELEGRAM_API_ID}
      TELEGRAM_API_HASH: ${TELEGRAM_API_HASH}
      TELEGRAM_LOCAL: "true"
    volumes:
      - telegram-bot-api-data:/var/lib/telegram-bot-api
    networks: [telegram]

networks:
  telegram:
  keys:

volumes:
  daedalus-state:
  daedalus-workspaces:
  telegram-bot-api-data:
  rebuild-trigger:
