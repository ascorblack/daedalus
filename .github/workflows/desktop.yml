# The desktop launcher, released on a desktop-v* tag as one archive per platform.
#
# Archives and not bare binaries: a browser download carries no execute bit, so a raw Mach-O or ELF
# file is not something a person can double-click, and on macOS Finder opens it in a text editor
# instead. The macOS archive holds an application bundle, signed and — when the secrets are there —
# notarized, so that opening it is the ordinary thing it looks like.
#
# The builds are on native runners and not cross-compiled from one, because the window is the
# operating system's own web view and reaching it means cgo. The exception is Linux, which is built
# with `-tags nowebview` and no cgo at all: a Linux binary linked against WebKitGTK cannot start on
# a machine without it, so the Linux archives keep the browser fallback and keep running everywhere.
# That is also why both Linux architectures still come off one runner.
#
# Each archive also carries ptyd, the terminal daemon a native installation runs for its host
# terminals. It is Go with a C library linked in (the screen emulator, which Zig builds), so it is
# built by ptyd/release.sh rather than by `go build` alone: Linux and Windows cross-compiled from one
# Linux runner with the pinned Zig as the C compiler (Linux fully static against musl, so it starts
# on any distribution), the Mac on the Mac runner with Apple's compiler.
name: desktop

# `test` and `window` run on every change to the launcher, not only on a tag: `window` is the only
# place the macOS and Windows halves are compiled at all, and a first compile that happens during a
# release is a compile that has nowhere to go but the release. The two jobs that publish are held
# back to the tag by the `if` on each of them.
on:
  push:
    tags: ["desktop-v*"]
    branches: [main]
    paths: ["desktop/**", "ptyd/**", ".github/workflows/desktop.yml"]
  pull_request:
    paths: ["desktop/**", "ptyd/**", ".github/workflows/desktop.yml"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  # The tests, on the runner that has nothing to install. On Linux the window's build constraint
  # (`!nowebview && (darwin || windows)`) excludes it, so both commands here compile the same code
  # twice: nothing on this runner can see a mistake in window.go.
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.23"
      - run: go vet ./...
        working-directory: desktop
      - run: go test ./...
        working-directory: desktop
      - run: go vet -tags nowebview ./...
        working-directory: desktop
      - run: go test -tags nowebview ./...
        working-directory: desktop

  # So the window is compiled where it exists, before the tag is built. Without this a syntax error
  # in window.go passes `test` and surfaces in `binaries`, which is after the tag has been pushed.
  window:
    strategy:
      fail-fast: false
      matrix:
        runner: [macos-latest, windows-latest]
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.23"
      - run: go build ./...
        working-directory: desktop
      - run: go vet ./...
        working-directory: desktop

  # The daemon's tests on each system it ships for. Linux and the Mac build the emulator and test with
  # it; Windows tests without cgo, which is what runs its pseudoconsole and job object for real — the
  # daemon's Windows half is otherwise only cross-compiled, and this job is the first place it runs.
  ptyd-test:
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.runner }}
    defaults:
      run:
        shell: bash
        working-directory: ptyd
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: ptyd/go.mod
          cache-dependency-path: ptyd/go.sum
      - name: Test with the emulator
        if: runner.os != 'Windows'
        run: |
          command -v pkg-config >/dev/null || brew install pkgconf
          PKG_CONFIG_PATH="$(libghostty/build.sh)"
          export PKG_CONFIG_PATH
          test -z "$(gofmt -l cmd internal)"
          go vet ./...
          go test ./...
          GOOS=windows go vet ./...
          GOOS=windows GOARCH=arm64 go vet ./...
      - name: Test the pseudoconsole
        if: runner.os == 'Windows'
        env:
          CGO_ENABLED: "0"
        run: |
          go vet ./...
          go test ./...

  ptyd:
    needs: [ptyd-test]
    if: startsWith(github.ref, 'refs/tags/desktop-v')
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-latest
            targets: "linux/amd64 linux/arm64 windows/amd64 windows/arm64"
          - runner: macos-latest
            targets: "darwin/amd64 darwin/arm64"
    runs-on: ${{ matrix.runner }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: ptyd/go.mod
          cache-dependency-path: ptyd/go.sum
      - name: Build
        run: |
          command -v pkg-config >/dev/null || brew install pkgconf
          mkdir -p ptyd-dist
          for t in ${{ matrix.targets }}; do
            goos=${t%/*} goarch=${t#*/}
            out="ptyd-dist/ptyd-$goos-$goarch"
            case "$goos" in windows) out="$out.exe";; esac
            ptyd/release.sh "$goos" "$goarch" "$PWD/$out"
          done
          ls -l ptyd-dist
      - uses: actions/upload-artifact@v4
        with:
          name: ptyd-${{ runner.os }}
          path: ptyd-dist
          retention-days: 1

  binaries:
    needs: [test, window]
    if: startsWith(github.ref, 'refs/tags/desktop-v')
    strategy:
      fail-fast: false
      matrix:
        include:
          # Both Mac slices come off the Apple Silicon runner and are joined into one universal
          # executable by the packaging job. The Intel slice is a cross-compile on the same machine:
          # Apple's toolchain builds x86_64 from arm64 with one flag, and the Intel runners spend
          # hours in a queue when they exist at all.
          - runner: macos-latest
            goos: darwin
            goarch: arm64
          - runner: macos-latest
            goos: darwin
            goarch: amd64
            arch_flags: "-arch x86_64"
          # The Windows runner has the compiler cgo needs; WebView2 is the user's to have, and the
          # launcher asks the registry for it before it tries to open a window.
          - runner: windows-latest
            goos: windows
            goarch: amd64
          - runner: ubuntu-latest
            goos: linux
            goarch: amd64
            tags: nowebview
            cgo: "0"
          - runner: ubuntu-latest
            goos: linux
            goarch: arm64
            tags: nowebview
            cgo: "0"
    runs-on: ${{ matrix.runner }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.23"

      - name: Build
        working-directory: desktop
        env:
          VERSION: ${{ github.ref_name }}
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: ${{ matrix.cgo || '1' }}
          TAGS: ${{ matrix.tags }}
          CGO_CFLAGS: ${{ matrix.arch_flags }}
          CGO_LDFLAGS: ${{ matrix.arch_flags }}
        run: |
          mkdir -p dist/bin
          out="dist/bin/daedalus-desktop-$GOOS-$GOARCH"
          case "$GOOS" in windows) out="$out.exe";; esac
          echo "building $out"
          go build -tags "$TAGS" -trimpath -ldflags "-s -w -X main.version=$VERSION" -o "$out" .
          ls -l "$out"

      - uses: actions/upload-artifact@v4
        with:
          name: desktop-${{ matrix.goos }}-${{ matrix.goarch }}
          path: desktop/dist/bin
          retention-days: 1

  # The bundle is built on macOS because only macOS has lipo, sips, iconutil, codesign and
  # notarytool. It is the last job, so it is also the one that publishes: the checksums have to
  # cover every archive, including its own.
  package:
    needs: [binaries, ptyd]
    if: startsWith(github.ref, 'refs/tags/desktop-v')
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          pattern: desktop-*
          merge-multiple: true
          path: desktop/dist/bin

      - uses: actions/download-artifact@v4
        with:
          pattern: ptyd-*
          merge-multiple: true
          path: desktop/dist/ptyd

      # The app itself, built once and put in every archive. A native installation has no image to
      # bake it into and may have no node to build it with, so without this the launcher would fetch
      # a Node toolchain on a first run just to produce 1.7 MB of static files.
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Build the Mini App
        run: |
          cd miniapp
          npm ci --no-audit --no-fund
          npm run build
          du -sh dist

      - name: Pack Linux and Windows
        working-directory: desktop
        run: |
          mkdir -p dist/archives stage
          # The tarball keeps the executable's mode, which is the whole point of shipping one: the
          # file comes out of it runnable, with nothing to chmod first. An artifact does not keep
          # that mode, so it is set again here.
          # ptyd goes beside the launcher, where it looks for it.
          cp -R ../miniapp/dist stage/miniapp-dist
          for arch in amd64 arm64; do
            cp "dist/bin/daedalus-desktop-linux-$arch" stage/daedalus-desktop
            cp "dist/ptyd/ptyd-linux-$arch" stage/ptyd
            chmod +x stage/daedalus-desktop stage/ptyd
            tar -czf "dist/archives/daedalus-desktop-linux-$arch.tar.gz" -C stage daedalus-desktop ptyd miniapp-dist
            rm stage/daedalus-desktop stage/ptyd
          done
          cp dist/bin/daedalus-desktop-windows-amd64.exe stage/daedalus-desktop.exe
          cp dist/ptyd/ptyd-windows-amd64.exe stage/ptyd.exe
          (cd stage && zip -qr ../dist/archives/daedalus-desktop-windows-amd64.zip daedalus-desktop.exe ptyd.exe miniapp-dist)
          rm -rf stage
          ls -l dist/archives

      - name: Build, sign and notarize Daedalus.app
        working-directory: desktop
        env:
          APPLE_CERTIFICATE_P12: ${{ secrets.APPLE_CERTIFICATE_P12 }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_APP_PASSWORD: ${{ secrets.APPLE_APP_PASSWORD }}
        run: |
          chmod +x dist/bin/daedalus-desktop-darwin-* dist/ptyd/ptyd-darwin-*
          export PTYD_AMD64=dist/ptyd/ptyd-darwin-amd64 PTYD_ARM64=dist/ptyd/ptyd-darwin-arm64
          MINIAPP_DIST=../miniapp/dist ./package-macos.sh "${{ github.ref_name }}" \
            dist/bin/daedalus-desktop-darwin-amd64 \
            dist/bin/daedalus-desktop-darwin-arm64 \
            dist/app
          mv dist/app/Daedalus-macOS.zip dist/archives/

      - name: Checksums
        working-directory: desktop
        run: |
          cd dist/archives
          # Written outside the folder first: a checksum file cannot cover itself, and a glob that
          # expanded after the redirect had made it would try.
          shasum -a 256 ./* | sed 's| \./| |' > ../SHA256SUMS
          mv ../SHA256SUMS SHA256SUMS
          cat SHA256SUMS

      - name: Release notes
        working-directory: desktop
        run: |
          if [ "$(cat dist/app/signing.txt)" = "developer-id" ]; then
            mac_open='Double-click **Daedalus** in the folder. The app is signed and notarized, so it opens like any other application.'
          else
            mac_open='Double-click **Daedalus** in the folder. This build is signed ad-hoc rather than with a Developer ID certificate, so the first time you open a copy that came through a browser, macOS asks: right-click the app, choose **Open**, then **Open** again. Only the first launch asks. A copy installed with the one-liner below never asks at all.'
          fi
          cat > dist/notes.md <<NOTES
          Daedalus on your own machine: one folder, Docker, and this launcher. It clones the two
          repositories, asks for the keys on a page of its own, starts the stack and opens the app —
          on macOS and Windows in a window of its own, on Linux in a browser window with nothing
          around it. **Docker Desktop (macOS, Windows) or Docker Engine with the compose plugin
          (Linux) has to be installed and running** — the launcher never installs it for you.

          ### Install it in one line — macOS and Linux

          \`\`\`sh
          curl -fsSL https://raw.githubusercontent.com/${{ github.repository }}/main/desktop/install.sh | sh
          \`\`\`

          It picks the right archive, checks it against the checksums below, and unpacks it into
          \`./Daedalus\`.

          ### Or download it

          | Machine | File | Then |
          |---|---|---|
          | macOS (Apple Silicon and Intel) | \`Daedalus-macOS.zip\` | Unzip it into a folder of its own. $mac_open |
          | Linux x86-64 | \`daedalus-desktop-linux-amd64.tar.gz\` | \`tar -xzf\` it into an empty folder and run \`./daedalus-desktop\`. |
          | Linux ARM64 | \`daedalus-desktop-linux-arm64.tar.gz\` | \`tar -xzf\` it into an empty folder and run \`./daedalus-desktop\`. |
          | Windows x86-64 | \`daedalus-desktop-windows-amd64.zip\` | \`Expand-Archive daedalus-desktop-windows-amd64.zip -DestinationPath Daedalus\` in PowerShell, then run \`daedalus-desktop.exe\`. The executable is unsigned, so SmartScreen warns once: **More info → Run anyway**. The window needs the WebView2 runtime, which Windows 11 and any machine with a current Edge already has; without it the launcher opens a browser instead. |

          The launcher makes everything else — the checkouts, the keys, the database — inside the folder
          you put it in, so deleting that folder deletes the installation.

          \`SHA256SUMS\` covers every archive here. [desktop/README.md](https://github.com/${{ github.repository }}/blob/main/desktop/README.md) has the folder layout, the disk the images take, and every command.
          NOTES
          cat dist/notes.md

      - name: Attach them to the release
        if: startsWith(github.ref, 'refs/tags/')
        working-directory: desktop
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release edit "$GITHUB_REF_NAME" --notes-file dist/notes.md
          else
            gh release create "$GITHUB_REF_NAME" --title "$GITHUB_REF_NAME" --notes-file dist/notes.md
          fi
          gh release upload "$GITHUB_REF_NAME" dist/archives/* --clobber
