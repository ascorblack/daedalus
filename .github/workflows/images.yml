# The image the desktop launcher pulls instead of building. A desktop install should not have to
# compile anything, so every change to what goes into the container publishes it again. There is one
# image for the whole stack: the key proxy is a second container from it, started with another
# command, so it is not published separately any more.
#
# Two tags out of one Dockerfile: ":latest" is the environment and nothing else, ":browser" adds
# Playwright and a headless Chromium for the skills that drive a page. They share every layer but the
# last, so publishing both costs the difference rather than twice the image.
name: images

on:
  push:
    branches: [main]
    paths:
      - deploy/**
      - daedalus/**
      - launcher/**
      - miniapp/**
      - pyproject.toml
      - uv.lock
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  agent:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - target: runtime
            suffix: latest
          - target: browser
            suffix: browser
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: .
          file: deploy/Dockerfile
          target: ${{ matrix.target }}
          push: true
          # Both architectures: with the browser out of the default image there is nothing left that
          # takes longer to build under emulation than a job gets, so Apple Silicon pulls like
          # everything else instead of building locally.
          platforms: linux/amd64,linux/arm64
          tags: |
            ghcr.io/${{ github.repository_owner }}/daedalus:${{ matrix.suffix }}
            ghcr.io/${{ github.repository_owner }}/daedalus:${{ matrix.suffix }}-${{ github.sha }}
          cache-from: type=gha,scope=${{ matrix.target }}
          cache-to: type=gha,mode=max,scope=${{ matrix.target }}
