# The image the desktop launcher pulls instead of building. A desktop install should not have to
# compile anything, so every change to what goes into the container publishes it again. There is one
# image for the whole stack: the key proxy is a second container from it, started with another
# command, so it is not published separately any more.
#
# Two tags out of one Dockerfile: ":latest" is the environment and nothing else, ":browser" adds
# Playwright, the headless Chromium the skills that drive a page use, and the full Chromium the
# `browser` compose service runs under browserd. They share every layer but the last, so publishing
# both costs the difference rather than twice the image.
name: images

on:
  push:
    branches: [main]
    paths:
      - deploy/**
      - daedalus/**
      - launcher/**
      - miniapp/**
      # The two daemons the image carries: a change to either is a change to what the image runs.
      - ptyd/**
      - browserd/**
      - pyproject.toml
      - uv.lock
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  agent:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - target: runtime
            suffix: latest
          - target: browser
            suffix: browser
    steps:
      - uses: actions/checkout@v4

      - name: Make room for the image
        if: matrix.target == 'browser'
        # The browser image carries two Chromium builds, twice over here (both architectures under
        # emulation), and the runner's default free space is not enough for it.
        run: |
          sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc /usr/local/.ghcup
          df -h /

      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: .
          file: deploy/Dockerfile
          target: ${{ matrix.target }}
          push: true
          # Both architectures: with the browser out of the default image there is nothing left that
          # takes longer to build under emulation than a job gets, so Apple Silicon pulls like
          # everything else instead of building locally.
          platforms: linux/amd64,linux/arm64
          tags: |
            ghcr.io/${{ github.repository_owner }}/daedalus:${{ matrix.suffix }}
            ghcr.io/${{ github.repository_owner }}/daedalus:${{ matrix.suffix }}-${{ github.sha }}
          cache-from: type=gha,scope=${{ matrix.target }}
          cache-to: type=gha,mode=max,scope=${{ matrix.target }}
