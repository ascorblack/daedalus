# The two images the desktop launcher pulls instead of building. A desktop install should not have
# to compile anything, so every change to what goes into the containers publishes them again.
name: images

on:
  push:
    branches: [main]
    paths:
      - deploy/**
      - daedalus/**
      - launcher/**
      - miniapp/**
      - pyproject.toml
      - uv.lock
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  agent:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Make room for the image
        # The agent image carries a headless Chromium; the runner's default free space is not enough.
        run: |
          sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc /usr/local/.ghcup
          df -h /

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: .
          file: deploy/Dockerfile
          push: true
          # Only amd64: building a headless Chromium under emulation takes longer than a CI job gets,
          # and the launcher builds locally when there is no image for the platform it runs on.
          platforms: linux/amd64
          tags: |
            ghcr.io/${{ github.repository_owner }}/daedalus:latest
            ghcr.io/${{ github.repository_owner }}/daedalus:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  keyproxy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: deploy/keyproxy
          push: true
          platforms: linux/amd64,linux/arm64
          tags: |
            ghcr.io/${{ github.repository_owner }}/daedalus-keyproxy:latest
            ghcr.io/${{ github.repository_owner }}/daedalus-keyproxy:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
